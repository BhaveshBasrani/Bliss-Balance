name: Deploy Bliss Balance to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyBWC00QfAhaTG3bG1uEEy9vr_dSArnm37k'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'blissbalanceauth.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'blissbalanceauth'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'blissbalanceauth.firebasestorage.app'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '99568588246'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:99568588246:web:54f523e71b894ded8c4077'
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: 'G-DQVHKGD55G'
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: '6LfVFIktAAAAAPRSJXz5I8lCUjX4vmXpnl0jCjoa'
          NEXT_PUBLIC_APPSCRIPT_URL: 'https://script.google.com/macros/s/AKfycbykDG_64LHgNhlS6gu-TowyNkTAC2Qfl3ohBoKmzQaub5oD0jj8Ah2Ow227lLG4D45ZzA/exec'

      - name: Ping IndexNow
        run: node scripts/ping-indexnow.js

      - name: Disable Jekyll on GitHub Pages (.nojekyll)
        run: mkdir -p ./out && touch ./out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
